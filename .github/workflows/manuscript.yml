name: Manuscript smoke build

concurrency:
  group: manuscript-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - audit/full-equilibrium-correspondence
    paths:
      - 'paper/**'
      - 'Makefile'
      - '.github/workflows/manuscript.yml'
  pull_request:
    paths:
      - 'paper/**'
      - 'Makefile'
      - '.github/workflows/manuscript.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install TeX build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-recommended texlive-fonts-recommended texlive-latex-extra

      - name: Build manuscript skeleton
        run: make paper
