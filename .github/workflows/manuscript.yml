name: Manuscript smoke build

concurrency:
  group: manuscript-\${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - audit/full-equilibrium-correspondence
    paths:
      - 'paper/**'
      - 'code/stage10_generate_figure.py'
      - '.python-version'
      - 'Makefile'
      - '.github/workflows/manuscript.yml'
  pull_request:
    paths:
      - 'paper/**'
      - 'code/stage10_generate_figure.py'
      - '.python-version'
      - 'Makefile'
      - '.github/workflows/manuscript.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'

      - name: Install TeX build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-recommended texlive-fonts-recommended texlive-latex-extra texlive-pictures

      - name: Generate figures and build manuscript
        run: make paper
